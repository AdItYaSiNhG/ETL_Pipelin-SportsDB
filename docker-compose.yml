x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__WEBSERVER__RBAC: "true"
    AIRFLOW__WEBSERVER__AUTH_BACKENDS: "airflow.contrib.auth.backends.password_auth"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    THESPORTSDB_API_KEY: ${THESPORTSDB_API_KEY:-1}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_ENDPOINT: http://minio:9000
    S3_ENDPOINT: minio:9000
    S3_USE_SSL: "false"
    S3_URL_STYLE: path
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./dbt_project:/opt/airflow/dbt_project
    - ./docker/airflow_logs:/opt/airflow/logs
    - ./requirements.txt:/opt/airflow/requirements.txt
  user: "${AIRFLOW_UID:-50000}:0"

services:
  minio:
    image: minio/minio:latest
    container_name: etl_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./docker/minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio_init:
    image: minio/mc:latest
    container_name: etl_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/raw-zone;
      mc mb --ignore-existing myminio/analytics-zone;
      mc anonymous set download myminio/raw-zone;
      mc anonymous set download myminio/analytics-zone;
      echo 'Buckets created: raw-zone, analytics-zone';
      "
    restart: "no"

  postgres:
    image: postgres:13
    container_name: etl_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow_scheduler:
    <<: *airflow-common
    container_name: etl_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  airflow_webserver:
    <<: *airflow-common
    container_name: etl_airflow_webserver
    command: webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"

  airflow_init:
    <<: *airflow-common
    container_name: etl_airflow_init
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command:
      - bash
      - -c
      - |
        airflow db init
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin} \
          --lastname ${AIRFLOW_ADMIN_LASTNAME:-User} \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} || echo 'User already exists'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  streamlit_app:
    <<: *airflow-common
    container_name: etl_streamlit
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command: streamlit run scripts/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    restart: always
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      <<: *airflow-common-env
      MINIO_ENDPOINT: http://minio:9000

networks:
  default:
    name: etl_network
