sports_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "/tmp/dbt/duckdb/sports.duckdb"
      threads: 4
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'minio:9000') }}"
        s3_use_ssl: "{{ env_var('S3_USE_SSL', 'false') }}"
        s3_url_style: "{{ env_var('S3_URL_STYLE', 'path') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY_ID', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_ACCESS_KEY', 'minioadmin') }}"
